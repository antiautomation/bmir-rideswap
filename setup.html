<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RideSwap SaaS – Setup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f3f4f6;font-family:Inter,Arial,sans-serif}
    .setup-container{background:#fff;padding:2rem 2.5rem;border-radius:0.75rem;box-shadow:0 10px 25px rgba(0,0,0,.05);width:100%;max-width:600px}
    h1{font-size:1.75rem;margin-bottom:1.5rem;text-align:center}
    .form-group{margin-bottom:1rem}
    label{display:block;font-weight:600;margin-bottom:0.25rem}
    input{width:100%;padding:0.5rem 0.75rem;border:1px solid #d1d5db;border-radius:0.375rem;font-size:1rem}
    input:invalid{border-color:#dc2626}
    .actions{display:flex;justify-content:flex-end;gap:1rem;margin-top:1.5rem}
    .btn{padding:0.5rem 1rem;border:none;border-radius:0.375rem;cursor:pointer;font-weight:600}
    .btn-primary{background:#10b981;color:#fff}
    .btn-primary:disabled{background:#6ee7b7;cursor:not-allowed}
    .note{font-size:0.875rem;color:#6b7280;margin-top:0.25rem}
  </style>
</head>
<body>
  <div class="setup-container">
    <h1>RideSwap SaaS – First-Run Setup</h1>
    <form id="setup-form" novalidate>
      <div class="form-group">
        <label for="eventName">Event Name *</label>
        <input id="eventName" name="eventName" maxlength="30" required placeholder="e.g., Desert Arts Festival" />
        <div class="note">Max 30 characters. Appears in buttons & titles.</div>
      </div>

      <div class="form-group">
        <label for="brandShortName">Brand Short Name / Acronym *</label>
        <input id="brandShortName" name="brandShortName" maxlength="15" required placeholder="e.g., DAF" />
        <div class="note">Max 15 characters. Used in meta & misc labels.</div>
      </div>

      <div class="form-group">
        <label for="siteTitle">Site Title *</label>
        <input id="siteTitle" name="siteTitle" maxlength="60" required placeholder="e.g., DAF RideSwap" />
      </div>

      <div class="form-group">
        <label for="originLocationName">Origin Location Name *</label>
        <input id="originLocationName" name="originLocationName" maxlength="60" required placeholder="e.g., Dusty Plains City" />
      </div>

      <div class="form-group">
        <label for="logoSquare">Square Logo URL *</label>
        <input id="logoSquare" name="logoSquare" type="url" required placeholder="https://example.com/logo-512.png" />
      </div>

      <div class="form-group">
        <label for="logoWide">Wide Logo URL</label>
        <input id="logoWide" name="logoWide" type="url" placeholder="https://example.com/logo-wide.png" />
      </div>

      <div class="actions">
        <button id="generate-btn" type="submit" class="btn btn-primary" disabled>Generate config.js</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('setup-form');
    const generateBtn = document.getElementById('generate-btn');

    form.addEventListener('input', () => {
      generateBtn.disabled = !form.checkValidity();
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!form.checkValidity()) return;

      const data = Object.fromEntries(new FormData(form).entries());

      const config = `// Auto-generated by setup.html\n\n`+
`const FIREBASE_CONFIG = {/* TODO: Fill your Firebase keys here */};\n\n`+
`const APP_CONFIG = { appId: "${data.brandShortName.toLowerCase()}-rideswap", projectId: "${data.brandShortName.toLowerCase()}-rideswap", collectionPath: "artifacts/${data.brandShortName.toLowerCase()}-rideswap/public/data" };\n\n`+
`const ANALYTICS_CONFIG = { trackingId: "UA-XXXXXXX-X", gtagUrl: "https://www.googletagmanager.com/gtag/js" };\n\n`+
`const RECAPTCHA_CONFIG = { siteKey: "YOUR_RECAPTCHA_SITE_KEY", apiUrl: "https://www.google.com/recaptcha/api.js" };\n\n`+
`const BRANDING_CONFIG = {\n  eventName: "${data.eventName}",\n  brandShortName: "${data.brandShortName}",\n  siteTitle: "${data.siteTitle}",\n  originLocationName: "${data.originLocationName}",\n  logos: { square: "${data.logoSquare}", wide: "${data.logoWide || data.logoSquare}" },\n  MAX_LENGTHS: { eventName: 30, brandShortName: 15, siteTitle: 60 }\n};\n\nconst BRAND_CONFIGURED = true;\n\nif (typeof module !== 'undefined' && module.exports) {\n  module.exports = { FIREBASE_CONFIG, APP_CONFIG, ANALYTICS_CONFIG, RECAPTCHA_CONFIG, BRANDING_CONFIG, BRAND_CONFIGURED };\n} else {\n  window.FIREBASE_CONFIG = FIREBASE_CONFIG;\n  window.APP_CONFIG = APP_CONFIG;\n  window.ANALYTICS_CONFIG = ANALYTICS_CONFIG;\n  window.RECAPTCHA_CONFIG = RECAPTCHA_CONFIG;\n  window.BRANDING_CONFIG = BRANDING_CONFIG;\n  window.BRAND_CONFIGURED = BRAND_CONFIGURED;\n}`;

      const blob = new Blob([config], {type: 'text/javascript'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'config.js';
      a.textContent = 'Click here if download does not start automatically.';

      // Automatically trigger download
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();

      // Show manual link
      generateBtn.textContent = 'Download generated – click if needed';
      generateBtn.disabled = true;
      generateBtn.replaceWith(a);

      // For instant preview within the setup page (helps confirm branding)
      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.textContent = config;
      document.head.appendChild(script);
      alert('config.js generated! Replace placeholder keys before deploying.');
    });
  </script>
</body>
</html>
